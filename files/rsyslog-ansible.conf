# /etc/rsyslog.d/10-ansible.conf
# Route Ansible task notifications (tagged "ansible") to a dedicated log file.
# Logged by callback_plugins/syslog_tasks.py using facility USER.
# Status codes: OK CHNG SKIP FAIL IGN UNRCH RESC PLAY DONE

:programname, isequal, "ansible"  /var/log/ansible.log
& stop
