<VirtualHost *:443>
    ServerName www.critchley.biz

    DocumentRoot /var/www/www.critchley.biz

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/www.critchley.biz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/www.critchley.biz/privkey.pem

    # Root → John's intro note
    RedirectMatch ^/$ /notes/john

    # Notes read-only web UI
    RedirectMatch ^/notes$ /notes/
    <Location /notes/>
        ProxyPass        http://127.0.0.1:8020/notes/
        ProxyPassReverse http://127.0.0.1:8020/notes/
    </Location>

    # gdata REST API — Basic Auth (used by notes CLI)
    # Routes to gdata-mcp-server REST port so only one process owns the GDBM file
    <Location /api/>
        ProxyPass        http://127.0.0.1:8020/
        ProxyPassReverse http://127.0.0.1:8020/

        AuthType Basic
        AuthName "gdata API"
        AuthUserFile /etc/apache2/.htpasswd-gdata
        Require valid-user
    </Location>

    # MCP SSE/StreamableHTTP — Bearer token validated inside Python
    # Use /mcp (no trailing slash) so both POST /mcp and GET /mcp match
    <Location /mcp>
        ProxyPass        http://127.0.0.1:8023/mcp flushpackets=on
        ProxyPassReverse http://127.0.0.1:8023/mcp
        SetEnv proxy-initial-not-pooled 1
    </Location>

    # OAuth protected-resource metadata (MCP spec discovery)
    <Location /.well-known/oauth-protected-resource>
        ProxyPass        http://127.0.0.1:8020/.well-known/oauth-protected-resource
        ProxyPassReverse http://127.0.0.1:8020/.well-known/oauth-protected-resource
    </Location>

    # OAuth endpoints — served by gdata-mcp-server REST port (8020)
    <Location /oauth/>
        ProxyPass        http://127.0.0.1:8020/oauth/
        ProxyPassReverse http://127.0.0.1:8020/oauth/
    </Location>

    # /authorize is the fallback path claude.ai uses when discovery is unavailable
    <Location /authorize>
        ProxyPass        http://127.0.0.1:8020/oauth/authorize
        ProxyPassReverse http://127.0.0.1:8020/oauth/authorize
    </Location>

    <Location /.well-known/oauth-authorization-server>
        ProxyPass        http://127.0.0.1:8020/.well-known/oauth-authorization-server
        ProxyPassReverse http://127.0.0.1:8020/.well-known/oauth-authorization-server
    </Location>

    <Directory /var/www/www.critchley.biz>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
