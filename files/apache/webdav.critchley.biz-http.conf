<VirtualHost *:80>
    ServerName webdav.critchley.biz

    DocumentRoot /var/www/webdav

    # ACME challenge passes through; everything else redirects to HTTPS
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=302,L]
</VirtualHost>
