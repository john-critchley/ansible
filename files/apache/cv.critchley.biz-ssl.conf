<VirtualHost *:443>
    ServerName cv.critchley.biz

    DocumentRoot /var/www/cv.critchley.biz

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/cv.critchley.biz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cv.critchley.biz/privkey.pem

    <Directory /var/www/cv.critchley.biz>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
