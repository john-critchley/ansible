<VirtualHost *:443>
    ServerName cv.critchley.biz

    DocumentRoot /var/www/cv.critchley.biz

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/critchley-multi/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/critchley-multi/privkey.pem

    <Directory /var/www/cv.critchley.biz>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
