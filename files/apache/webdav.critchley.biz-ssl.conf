<VirtualHost *:443>
    ServerName webdav.critchley.biz

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/critchley-multi/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/critchley-multi/privkey.pem

    DocumentRoot /var/www/webdav

    <Directory /var/www/webdav>
        DAV On
        AuthType Basic
        AuthName "Critchley WebDAV"
        AuthUserFile /etc/apache2/.htpasswd-webdav
        Require valid-user

        Options Indexes
        AllowOverride None
    </Directory>

    # Mail delivery: expose Maildir vhosts via WebDAV so popit3 can PUT
    # messages directly into new/ directories for Dovecot to pick up.
    Alias /mail /var/mail/vhosts

    <Directory /var/mail/vhosts>
        DAV On
        AuthType Basic
        AuthName "Critchley WebDAV"
        AuthUserFile /etc/apache2/.htpasswd-webdav
        Require valid-user
        Options Indexes
        AllowOverride None
    </Directory>

    # Store DAV locks outside the document root
    DavLockDB /var/lock/apache2/DAVLock
</VirtualHost>
