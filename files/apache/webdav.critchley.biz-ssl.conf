<VirtualHost *:443>
    ServerName webdav.critchley.biz

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/webdav.critchley.biz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/webdav.critchley.biz/privkey.pem

    DocumentRoot /var/www/webdav

    <Directory /var/www/webdav>
        DAV On
        AuthType Basic
        AuthName "Critchley WebDAV"
        AuthUserFile /etc/apache2/.htpasswd-webdav
        Require valid-user

        Options Indexes
        AllowOverride None
    </Directory>

    # Store DAV locks outside the document root
    DavLockDB /var/lock/apache2/DAVLock
</VirtualHost>
