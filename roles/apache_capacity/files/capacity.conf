# Managed by Ansible: roles/apache_capacity
# 16 active children x 25 threads; 16 extra scoreboard slots for draining
# generations after logrotate/reloads. ServerLimit requires a full restart.
<IfModule mpm_event_module>
    ServerLimit 32
    StartServers 2
    ThreadLimit 64
    ThreadsPerChild 25
    MinSpareThreads 25
    MaxSpareThreads 75
    MaxRequestWorkers 400
    MaxConnectionsPerChild 0
</IfModule>
KeepAlive On
KeepAliveTimeout 2
MaxKeepAliveRequests 100

# Bound silent upstream stalls; active SSE heartbeats reset this I/O timeout.
# This is not an absolute stream lifetime limit.
ProxyTimeout 120

ExtendedStatus On
<Location /server-status>
    SetHandler server-status
    Require local
</Location>
