---
# Configure a provisioned Debian instance as a headless web-browser host:
# Firefox + TigerVNC (display :1) + XFCE, driven deterministically from the
# controller (kelp) via xdotool/ffdrive, and also reachable interactively over
# stunnel (Mac / pomelo / any client) with the RealVNC viewer.
#
# Reason for a dedicated host: running Firefox on kelp exhausts RAM and swaps.
#
# Usage:
#   ansible-playbook setup_browser_host.yml -e "target=<host>" -e @secrets.yml
#   # size it with enough memory to avoid swap, e.g. launch as t3.large (8 GB):
#   ./launch_instance.sh --instance-name <host> --region eu-central-1 --instance-type t3.large
#
# Run after launch_instance.yml (and the base playbook.yml) have provisioned the
# host. See notes: ansible/aws-browser-host.
#
# Tags:
#   browser   — Firefox, XFCE, X utilities, ImageMagick(+HEIC), fonts
#   vnc       — TigerVNC server on :1 (depth 24, 1920x1080, SecurityTypes None, -localhost)
#   ffdrive   — deploy the ffdrive wrapper + driving tools
#   stunnel   — expose VNC over TLS (mTLS, verify=2) for remote viewers
#   verify    — post-setup sanity checks

- name: Configure web-browser host
  hosts: "{{ target }}"
  become: yes
  gather_facts: yes
  vars:
    browser_user: john
    browser_home: /home/john
    vnc_display: "1"
    vnc_geometry: "1920x1080"
    vnc_depth: "24"
    vnc_rfb_port: 5901          # 5900 + display
    vnc_stunnel_port: 15901     # TLS front for the VNC RFB port
    vnc_cert_cn: "{{ inventory_hostname_short }}.critchley.biz"
    vnc_client_cn: "vnc-client"
    vnc_bundle_fetch_dir: "/home/john/ssl/browser-hosts"

  tasks:

    # ── Browser + desktop packages ────────────────────────────────────────────

    - name: Install browser, desktop and imaging packages
      apt:
        name:
          - firefox-esr
          - xfce4-session
          - xfwm4
          - xfce4-panel
          - xfce4-settings
          - xfdesktop4
          - xterm
          - dbus-x11
          - x11-xserver-utils
          - xdotool
          - wmctrl
          - imagemagick
          - libheif1              # HEIC delegate for ImageMagick (iPhone tickets)
          - fonts-dejavu
          - fonts-liberation
        state: present
        update_cache: yes
      tags: browser

    # ── TigerVNC server on :1 ─────────────────────────────────────────────────

    - name: Install TigerVNC server
      apt:
        name:
          - tigervnc-standalone-server
          - tigervnc-common
        state: present
      tags: vnc

    - name: Ensure ~/.vnc exists
      file:
        path: "{{ browser_home }}/.vnc"
        state: directory
        owner: "{{ browser_user }}"
        group: "{{ browser_user }}"
        mode: '0700'
      tags: vnc

    - name: Deploy VNC xstartup (XFCE session)
      copy:
        src: files/browser/xstartup
        dest: "{{ browser_home }}/.vnc/xstartup"
        owner: "{{ browser_user }}"
        group: "{{ browser_user }}"
        mode: '0755'
      tags: vnc

    - name: Deploy per-user VNC config (geometry/depth, no auth, localhost only)
      copy:
        dest: "{{ browser_home }}/.vnc/config"
        owner: "{{ browser_user }}"
        group: "{{ browser_user }}"
        mode: '0644'
        content: |
          geometry={{ vnc_geometry }}
          depth={{ vnc_depth }}
          localhost
          SecurityTypes=None
          desktop={{ inventory_hostname_short }}
      tags: vnc

    - name: Map display :{{ vnc_display }} to {{ browser_user }} in vncserver.users
      lineinfile:
        path: /etc/tigervnc/vncserver.users
        create: yes
        regexp: "^:{{ vnc_display }}="
        line: ":{{ vnc_display }}={{ browser_user }}"
        mode: '0644'
      tags: vnc

    - name: Enable and start tigervncserver@:{{ vnc_display }}
      systemd:
        name: "tigervncserver@:{{ vnc_display }}.service"
        enabled: yes
        state: started
        daemon_reload: yes
      tags: vnc

    # ── ffdrive driving wrapper ───────────────────────────────────────────────

    - name: Ensure ~/bin exists
      file:
        path: "{{ browser_home }}/bin"
        state: directory
        owner: "{{ browser_user }}"
        group: "{{ browser_user }}"
        mode: '0755'
      tags: ffdrive

    - name: Deploy ffdrive wrapper
      copy:
        src: files/browser/ffdrive
        dest: "{{ browser_home }}/bin/ffdrive"
        owner: "{{ browser_user }}"
        group: "{{ browser_user }}"
        mode: '0755'
      tags: ffdrive

    # ── stunnel: expose VNC over TLS for remote viewers ───────────────────────

    - name: Install stunnel4
      apt:
        name: stunnel4
        state: present
      tags: stunnel

    # T3: this host is its own independent trust domain (ssl-patterns
    # hub-and-spoke), NOT the shared pomelo-rooted CA. A fresh self-signed cert
    # is generated on the host and used as BOTH the stunnel server leaf and the
    # CA that verifies inbound clients (CAfile = server.pem, verify = 2). A
    # client cert signed by it is issued for remote viewers (Mac/pomelo). The
    # CA private key never leaves this throwaway host. See notes ssl-patterns,
    # ssl/pki, ssl/create-certs (pattern), ~/py/ssl/gen_certs.sh.
    - name: Ensure /etc/stunnel exists
      file:
        path: /etc/stunnel
        state: directory
        mode: '0755'
      tags: stunnel

    - name: Generate self-signed server/CA cert (server leaf doubles as client CA)
      command: >
        openssl req -x509 -newkey rsa:2048 -nodes -days 365
        -keyout /etc/stunnel/server.key -out /etc/stunnel/server.pem
        -subj "/CN={{ vnc_cert_cn }}"
      args:
        creates: /etc/stunnel/server.pem
      tags: stunnel

    - name: Secure the server key and cert
      file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/stunnel/server.key, mode: '0600' }
        - { path: /etc/stunnel/server.pem, mode: '0644' }
      tags: stunnel

    - name: Generate VNC client key
      command: openssl genrsa -out /etc/stunnel/vnc-client.key 2048
      args:
        creates: /etc/stunnel/vnc-client.key
      tags: stunnel

    - name: Generate VNC client CSR
      command: >
        openssl req -new -key /etc/stunnel/vnc-client.key
        -out /etc/stunnel/vnc-client.csr -subj "/CN={{ vnc_client_cn }}"
      args:
        creates: /etc/stunnel/vnc-client.csr
      tags: stunnel

    - name: Sign the VNC client cert with the host CA
      command: >
        openssl x509 -req -in /etc/stunnel/vnc-client.csr
        -CA /etc/stunnel/server.pem -CAkey /etc/stunnel/server.key
        -CAcreateserial -out /etc/stunnel/vnc-client.crt -days 365
      args:
        creates: /etc/stunnel/vnc-client.crt
      tags: stunnel

    - name: Provide CA cert (= server cert) copy for the client bundle
      copy:
        src: /etc/stunnel/server.pem
        dest: /etc/stunnel/ca.pem
        remote_src: yes
        mode: '0644'
      tags: stunnel

    - name: Write a sample client stunnel conf for viewers
      copy:
        dest: /etc/stunnel/vnc-client.conf.sample
        mode: '0644'
        content: |
          ; VNC client-side stunnel — run on the Mac / pomelo / any viewer host.
          ; Then point a RealVNC/TigerVNC viewer at localhost:5901.
          verify = 2
          CAfile = ca.pem
          cert   = vnc-client.crt
          key    = vnc-client.key

          [vnc]
          client = yes
          accept = 5901
          connect = {{ vnc_cert_cn }}:{{ vnc_stunnel_port }}
          checkHost = {{ vnc_cert_cn }}
      tags: stunnel

    - name: Stage the client bundle (ca.pem + client cert/key + sample conf)
      command: >
        tar -czf /etc/stunnel/vnc-client-bundle.tar.gz
        -C /etc/stunnel ca.pem vnc-client.crt vnc-client.key vnc-client.conf.sample
      args:
        creates: /etc/stunnel/vnc-client-bundle.tar.gz
      tags: stunnel

    - name: Fetch the client bundle back to the controller
      fetch:
        src: /etc/stunnel/vnc-client-bundle.tar.gz
        dest: "{{ vnc_bundle_fetch_dir }}/{{ inventory_hostname_short }}/"
        flat: yes
      tags: stunnel

    - name: Configure stunnel VNC front (mTLS)
      copy:
        dest: /etc/stunnel/vnc.conf
        mode: '0644'
        owner: root
        group: root
        content: |
          pid = /var/run/stunnel-vnc.pid
          foreground = no
          debug = info
          output = /var/log/stunnel-vnc.log

          cert = /etc/stunnel/server.pem
          key  = /etc/stunnel/server.key
          CAfile = /etc/stunnel/server.pem
          verify = 2

          [vnc]
          accept  = {{ vnc_stunnel_port }}
          connect = 127.0.0.1:{{ vnc_rfb_port }}
      notify: Restart stunnel
      tags: stunnel

    - name: Enable stunnel4
      systemd:
        name: stunnel4
        enabled: yes
        state: started
        daemon_reload: yes
      tags: stunnel

    # ── Verify ────────────────────────────────────────────────────────────────

    - name: Check the VNC RFB port is listening on localhost
      wait_for:
        host: 127.0.0.1
        port: "{{ vnc_rfb_port }}"
        timeout: 30
      tags: verify

    - name: Confirm Firefox is installed
      command: firefox-esr --version
      register: ff_ver
      changed_when: false
      tags: verify

    - name: Show Firefox version
      debug:
        var: ff_ver.stdout
      tags: verify

  handlers:
    - name: Restart stunnel
      systemd:
        name: stunnel4
        state: restarted
