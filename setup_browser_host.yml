---
# Configure a provisioned Debian instance as a headless web-browser host:
# Firefox + TigerVNC (display :1) + XFCE, driven deterministically from the
# controller (kelp) via xdotool/ffdrive, and also reachable interactively over
# stunnel (Mac / pomelo / any client) with the RealVNC viewer.
#
# Reason for a dedicated host: running Firefox on kelp exhausts RAM and swaps.
#
# Usage:
#   ansible-playbook setup_browser_host.yml -e "target=<host>" -e @secrets.yml
#   # size it with enough memory to avoid swap, e.g. launch as t3.large (8 GB):
#   ./launch_instance.sh --instance-name <host> --region eu-central-1 --instance-type t3.large
#
# Run after launch_instance.yml (and the base playbook.yml) have provisioned the
# host. See notes: ansible/aws-browser-host.
#
# Tags:
#   browser   — Firefox, XFCE, X utilities, ImageMagick(+HEIC), fonts
#   vnc       — TigerVNC server on :1 (depth 24, 1920x1080, SecurityTypes None, -localhost)
#   ffdrive   — deploy the ffdrive wrapper + driving tools
#   stunnel   — expose VNC over TLS (mTLS, verify=2) for remote viewers
#   verify    — post-setup sanity checks

- name: Configure web-browser host
  hosts: "{{ target }}"
  become: yes
  gather_facts: yes
  vars:
    browser_user: john
    browser_home: /home/john
    vnc_display: "1"
    vnc_geometry: "1920x1080"
    vnc_depth: "24"
    vnc_rfb_port: 5901          # 5900 + display
    vnc_stunnel_port: 15901     # TLS front for the VNC RFB port

  tasks:

    # ── Browser + desktop packages ────────────────────────────────────────────

    - name: Install browser, desktop and imaging packages
      apt:
        name:
          - firefox-esr
          - xfce4-session
          - xfwm4
          - xfce4-panel
          - xfce4-settings
          - xfdesktop4
          - xterm
          - dbus-x11
          - x11-xserver-utils
          - xdotool
          - wmctrl
          - imagemagick
          - libheif1              # HEIC delegate for ImageMagick (iPhone tickets)
          - fonts-dejavu
          - fonts-liberation
        state: present
        update_cache: yes
      tags: browser

    # ── TigerVNC server on :1 ─────────────────────────────────────────────────

    - name: Install TigerVNC server
      apt:
        name:
          - tigervnc-standalone-server
          - tigervnc-common
        state: present
      tags: vnc

    - name: Ensure ~/.vnc exists
      file:
        path: "{{ browser_home }}/.vnc"
        state: directory
        owner: "{{ browser_user }}"
        group: "{{ browser_user }}"
        mode: '0700'
      tags: vnc

    - name: Deploy VNC xstartup (XFCE session)
      copy:
        src: files/browser/xstartup
        dest: "{{ browser_home }}/.vnc/xstartup"
        owner: "{{ browser_user }}"
        group: "{{ browser_user }}"
        mode: '0755'
      tags: vnc

    - name: Deploy per-user VNC config (geometry/depth, no auth, localhost only)
      copy:
        dest: "{{ browser_home }}/.vnc/config"
        owner: "{{ browser_user }}"
        group: "{{ browser_user }}"
        mode: '0644'
        content: |
          geometry={{ vnc_geometry }}
          depth={{ vnc_depth }}
          localhost
          SecurityTypes=None
          desktop={{ inventory_hostname_short }}
      tags: vnc

    - name: Map display :{{ vnc_display }} to {{ browser_user }} in vncserver.users
      lineinfile:
        path: /etc/tigervnc/vncserver.users
        create: yes
        regexp: "^:{{ vnc_display }}="
        line: ":{{ vnc_display }}={{ browser_user }}"
        mode: '0644'
      tags: vnc

    - name: Enable and start tigervncserver@:{{ vnc_display }}
      systemd:
        name: "tigervncserver@:{{ vnc_display }}.service"
        enabled: yes
        state: started
        daemon_reload: yes
      tags: vnc

    # ── ffdrive driving wrapper ───────────────────────────────────────────────

    - name: Ensure ~/bin exists
      file:
        path: "{{ browser_home }}/bin"
        state: directory
        owner: "{{ browser_user }}"
        group: "{{ browser_user }}"
        mode: '0755'
      tags: ffdrive

    - name: Deploy ffdrive wrapper
      copy:
        src: files/browser/ffdrive
        dest: "{{ browser_home }}/bin/ffdrive"
        owner: "{{ browser_user }}"
        group: "{{ browser_user }}"
        mode: '0755'
      tags: ffdrive

    # ── stunnel: expose VNC over TLS for remote viewers ───────────────────────

    - name: Install stunnel4
      apt:
        name: stunnel4
        state: present
      tags: stunnel

    # NOTE (T3): reuse the server cert/key that setup_server.yml deploys. mTLS
    # client CA + per-host client bundle are still to be wired up — see the
    # ansible/aws-browser-host note, task T3.
    - name: Deploy stunnel server certificate
      copy:
        src: /home/john/ssl/C/CA/cert
        dest: /etc/stunnel/server.pem
        mode: '0644'
        owner: root
        group: root
      tags: stunnel

    - name: Deploy stunnel server key
      copy:
        src: /home/john/ssl/C/CA/key
        dest: /etc/stunnel/server.key
        mode: '0600'
        owner: root
        group: root
      tags: stunnel

    - name: Configure stunnel VNC front (mTLS)
      copy:
        dest: /etc/stunnel/vnc.conf
        mode: '0644'
        owner: root
        group: root
        content: |
          pid = /var/run/stunnel-vnc.pid
          foreground = no
          debug = info
          output = /var/log/stunnel-vnc.log

          cert = /etc/stunnel/server.pem
          key  = /etc/stunnel/server.key
          CAfile = /etc/stunnel/server.pem
          verify = 2

          [vnc]
          accept  = {{ vnc_stunnel_port }}
          connect = 127.0.0.1:{{ vnc_rfb_port }}
      notify: Restart stunnel
      tags: stunnel

    - name: Enable stunnel4
      systemd:
        name: stunnel4
        enabled: yes
        state: started
        daemon_reload: yes
      tags: stunnel

    # ── Verify ────────────────────────────────────────────────────────────────

    - name: Check the VNC RFB port is listening on localhost
      wait_for:
        host: 127.0.0.1
        port: "{{ vnc_rfb_port }}"
        timeout: 30
      tags: verify

    - name: Confirm Firefox is installed
      command: firefox-esr --version
      register: ff_ver
      changed_when: false
      tags: verify

    - name: Show Firefox version
      debug:
        var: ff_ver.stdout
      tags: verify

  handlers:
    - name: Restart stunnel
      systemd:
        name: stunnel4
        state: restarted
