---
# Launch EC2 instance and configure with Claude Code
# Usage: ansible-playbook launch_instance.yml -e "name=myhost region=us-east-1"
#    or: ansible-playbook launch_instance.yml -e "instance_name=myhost region=eu-central-1"
# Optional: -e "instance_type=t3.medium ami=<region-specific-ami> spot=yes remove_sudo=yes aliases='weblogicserver foo'"

- name: Launch EC2 instance and update local hosts
  hosts: localhost
  gather_facts: no
  vars:
    launch_instance_name: "{{ name | default(instance_name | default('', true), true) }}"
    launch_region: "{{ region | default('us-east-1', true) }}"
    launch_instance_type: "{{ instance_type | default('t3.medium', true) }}"
    default_ami_map:
      us-east-1: ami-095f312bef9bfe5b1
      eu-central-1: ami-00ebb2b898eebe380
    arm_ami_map:
      eu-central-1: ami-08241d277446b81d7
      eu-north-1: ami-0fd7923e0af278466
    extra_aliases: "{{ aliases | default('', true) }}"
    launch_ami: >-
      {{ ami | default(
        arm_ami_map.get(launch_region, '')
        if launch_instance_type.split('.')[0] in ['t4g', 'm7g', 'c7g', 'r8g', 'r8gd', 'c8g', 'm8g']
        else default_ami_map.get(launch_region, default_ami_map['us-east-1']),
        true) }}
    spot_raw: "{{ spot | default('no', true) }}"
    spot_bool: "{{ spot_raw | lower in ['yes', 'true', '1'] }}"
    awslaunch_path: /home/john/aws/awslaunch.py
    aws_open_port_path: /home/john/aws/aws_open_port.py
    ssh_pubkey_path: /home/john/.ssh/id_ed25519.pub
    inventory_path: /home/john/ansible/hosts.ini

  tasks:
    - name: Launch instance via awslaunch.py
      command: >
        {{ awslaunch_path }} {{ launch_instance_name }} {{ launch_instance_type }}
        --region {{ launch_region }}
        --ami {{ launch_ami }}
        {{ '--spot' if spot_bool else '' }}
      register: launch_output

    - name: Debug launch output
      debug:
        var: launch_output.stdout_lines

    - name: Extract hosts line
      set_fact:
        hosts_line_raw: "{{ launch_output.stdout_lines | select('match', '^Hosts:') | first | regex_replace('^Hosts: ', '') }}"

    - name: Extract public IP
      set_fact:
        instance_ip: "{{ hosts_line_raw.split()[0] }}"

    - name: Extract instance ID
      set_fact:
        instance_id: "{{ hosts_line_raw.split()[3] }}"

    - name: Build hosts line
      # Format: IP shortname shortname.critchley.biz [aliases] instance-id
      set_fact:
        hosts_line: "{{ hosts_line_raw.split()[:-1] | join(' ') }}{{ ' ' + extra_aliases if extra_aliases else '' }} {{ hosts_line_raw.split()[-1] }}"

    - name: Remove old hosts entry for this host if exists
      lineinfile:
        path: /etc/hosts
        regexp: '^[0-9.]+\s+{{ launch_instance_name }}\s'
        state: absent
      become: yes

    - name: Check if exact hosts line already present
      shell: grep -qF "{{ hosts_line }}" /etc/hosts
      register: hosts_check
      failed_when: false
      changed_when: false

    - name: Add hosts entry to /etc/hosts
      shell: echo "{{ hosts_line }}" | sudo dd of=/etc/hosts oflag=append conv=notrunc status=none
      when: hosts_check.rc != 0

    - name: Send UDP reload packet to awsctl daemon
      shell: echo -n "reload" | nc -u -w1 127.0.0.1 5
      register: udp_response
      when: hosts_check.rc != 0

    - name: Verify reload response
      debug:
        msg: "awsctl response: {{ udp_response.stdout }}"
      when: hosts_check.rc != 0

    - name: Check if host already in inventory
      shell: grep -q "^{{ launch_instance_name }}$" {{ inventory_path }}
      register: inventory_check
      failed_when: false
      changed_when: false

    - name: Add host to inventory under region group
      lineinfile:
        path: "{{ inventory_path }}"
        line: "{{ launch_instance_name }}"
        insertafter: "^\\[{{ launch_region }}\\]"
      when: inventory_check.rc != 0

    - name: Open port 22 for spot instance
      command: >
        {{ aws_open_port_path }} {{ instance_id }} 22 any --region {{ region }}
      when: spot_bool

    - name: Update hosts note
      command: >
        /home/john/aws/update_hosts_note.py provision
        {{ launch_instance_name }} {{ instance_id }} {{ launch_region }} {{ instance_ip }}
        --type {{ 'spot' if spot_bool else 'permanent' }}
        {{ '--project ' + project if project is defined else '' }}
      delegate_to: localhost
      become: no
      ignore_errors: yes

    - name: Add new host to in-memory inventory
      add_host:
        name: "{{ launch_instance_name }}"
        ansible_host: "{{ instance_ip }}"
        ansible_user: admin
        ansible_ssh_private_key_file: "/home/john/.ssh/{{ launch_instance_name }}.pem"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ForwardAgent=yes"
        instance_name: "{{ launch_instance_name }}"
        groups: new_instance

    - name: Wait for SSH to be available
      wait_for:
        host: "{{ instance_ip }}"
        port: 22
        delay: 5
        timeout: 120

    - name: Add host key to local known_hosts
      known_hosts:
        name: "{{ instance_ip }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -t ed25519 ' + instance_ip + ' 2>/dev/null') }}"
        path: /home/john/.ssh/known_hosts
        state: present

    - name: Add host key by name to local known_hosts
      known_hosts:
        name: "{{ launch_instance_name }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -t ed25519 ' + instance_ip + ' 2>/dev/null') | regex_replace('^[^ ]+', launch_instance_name) }}"
        path: /home/john/.ssh/known_hosts
        state: present


- name: Configure the new instance
  hosts: "{{ target | default('new_instance') }}"
  gather_facts: yes
  become: yes
  vars:
    ssh_pubkey_path: /home/john/.ssh/id_ed25519.pub
    ssh_pubkey_epam_path: /home/john/.ssh/id_ed25519_epam.pub
    remove_sudo_raw: "{{ remove_sudo | default('no') }}"
    remove_sudo_bool: "{{ remove_sudo_raw | lower in ['yes', 'true', '1'] }}"
    instance_name: "{{ launch_instance_name | default(inventory_hostname) }}"

  tasks:
    - name: Read local SSH public key
      set_fact:
        ssh_pubkey: "{{ lookup('file', ssh_pubkey_path) }}"
      tags: always

    - name: Read local SSH public key (epam)
      set_fact:
        ssh_pubkey_epam: "{{ lookup('file', ssh_pubkey_epam_path) }}"
      tags: always

    - name: Get admin user info
      getent:
        database: passwd
        key: admin
      tags: always

    - name: Set admin uid/gid facts
      set_fact:
        admin_uid: "{{ getent_passwd['admin'][1] }}"
        admin_gid: "{{ getent_passwd['admin'][2] }}"
      tags: always

    # ── user ──────────────────────────────────────────────────────────────────

    - name: Set hostname
      hostname:
        name: "{{ instance_name }}"
      tags: user

    - name: Set FQDN in /etc/hosts
      lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1'
        line: "127.0.1.1 {{ instance_name }}.critchley.biz {{ instance_name }}"
        insertafter: '^127\.0\.0\.1'
      tags: user

    - name: Ensure root .ssh directory exists
      file:
        path: /root/.ssh
        state: directory
        mode: '0700'
        owner: root
        group: root
      tags: user

    - name: Add SSH key to root authorized_keys
      authorized_key:
        user: root
        key: "{{ ssh_pubkey }}"
        state: present
      tags: user

    - name: Enable root SSH login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin prohibit-password'
      notify: Restart sshd
      tags: user

    - name: Flush handlers to restart sshd before testing root access
      meta: flush_handlers
      tags: user

    - name: Test root SSH access
      delegate_to: localhost
      become: no
      command: ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -i /home/john/.ssh/id_ed25519 root@{{ hostvars[inventory_hostname]['ansible_host'] | default(inventory_hostname) }} echo "root access works"
      register: root_test
      retries: 3
      delay: 5
      until: root_test.rc == 0
      tags: user

    - name: Create john user with same uid/gid as admin
      user:
        name: john
        uid: "{{ admin_uid }}"
        group: "{{ admin_gid }}"
        home: /home/john
        shell: /bin/bash
        create_home: yes
        non_unique: yes
      tags: user

    - name: Add SSH key to john authorized_keys
      authorized_key:
        user: john
        key: "{{ ssh_pubkey }}"
        state: present
      tags: user

    # ── packages ──────────────────────────────────────────────────────────────

    - name: Install locales package
      apt:
        name: locales
        state: present
        update_cache: yes
      tags: packages

    - name: Generate en_GB.UTF-8 locale
      locale_gen:
        name: en_GB.UTF-8
        state: present
      tags: packages

    - name: Update apt cache and upgrade packages
      apt:
        update_cache: yes
        upgrade: dist
      tags: packages

    - name: Install prerequisites
      apt:
        name:
          - curl
          - ca-certificates
          - rsync
          - git
          - python-is-python3
          - python3-pip
          - libssl-dev
          - ansible-core
        state: present
      tags: packages

#    - name: Copy .bashrc to john home
#      become: no
#      copy:
#        src: /home/john/.bashrc
#        dest: /home/john/.bashrc
#        owner: john
#        group: "{{ admin_gid }}"
#        mode: '0644'

    # ── skeleton ──────────────────────────────────────────────────────────────

    - name: Rsync weekday/john directory to john home
      become: no
      synchronize:
        src: /home/john/ansible/weekday/john/
        dest: /home/john/
        recursive: yes
      tags: skeleton

#    - name: Ensure pip config directory exists
#      become: no
#      file:
#        path: /home/john/.config/pip
#        state: directory
#        mode: '0755'

#    - name: Configure pip for john to use --break-system-packages
#      become: no
#      copy:
#        dest: /home/john/.config/pip/pip.conf
#        content: |
#          [global]
#          break-system-packages = true
#        mode: '0644'

    # ── nodejs ────────────────────────────────────────────────────────────────

    - name: Add NodeSource repository
      shell: curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      args:
        creates: /etc/apt/sources.list.d/nodesource.list
      tags: nodejs

    - name: Install Node.js
      apt:
        name: nodejs
        state: present
        update_cache: yes
      tags: nodejs

#    - name: Create npm global directory for john
#      file:
#        path: /home/john/.npm
#        state: directory
#        owner: john
#        group: "{{ admin_gid }}"
#        mode: '0755'

#    - name: Add npm global bin to john's PATH
#      lineinfile:
#        path: /home/john/.bashrc
#        line: 'export PATH="/home/john/.npm/bin:$PATH"'
#        create: yes
#        owner: john
#        group: "{{ admin_gid }}"

    # npm tasks use become: no - admin and john share UID so we can write to john's home
#    - name: Configure npm prefix for john
#      become: no
#      shell: npm config set prefix '/home/john/.npm'
#      environment:
#        HOME: /home/john

    # ── claude ────────────────────────────────────────────────────────────────

    - name: Install Claude Code for john
      shell: curl -fsSL https://claude.ai/install.sh | bash
      become: no
      environment:
        HOME: /home/john
      tags: claude

    - name: Copy Claude Code credentials from controller
      copy:
        src: "{{ lookup('env', 'HOME') }}/.claude/.credentials.json"
        dest: /home/john/.claude/.credentials.json
        owner: john
        mode: '0600'
      become: no
      tags: claude

    - name: Install Python requirements
      shell: pip3 install --user --break-system-packages -r /home/john/requirements.txt
      become: no
      changed_when: false
      environment:
        HOME: /home/john
      tags: claude

    # ── codex ─────────────────────────────────────────────────────────────────

    - name: Read OpenAI API key from controller secrets
      set_fact:
        openai_api_key: "{{ lookup('file', lookup('env', 'HOME') + '/ansible/secrets.yml') | from_yaml | json_query('openai_api_key') }}"
      delegate_to: localhost
      become: no
      no_log: true
      tags: codex

    - name: Install OpenAI Codex CLI
      npm:
        name: "@openai/codex"
        global: yes
        state: present
      tags: codex

    - name: Deploy OPENAI_API_KEY to api_keys bashrcs
      copy:
        dest: /home/john/.bashrcs/api_keys
        content: "export OPENAI_API_KEY={{ openai_api_key }}\n"
        owner: john
        mode: '0700'
      become: no
      no_log: true
      tags: codex

    - name: Log in to Codex with API key
      shell: echo "{{ openai_api_key }}" | codex login --with-api-key
      become: no
      environment:
        HOME: /home/john
      no_log: true
      tags: codex

    # ── ansible-ctl (make this host an ansible controller) ───────────────────

    - name: Deploy admin SSH config for GitHub agent forwarding
      copy:
        dest: /home/admin/.ssh/config
        owner: admin
        mode: '0600'
        content: |
          Host github.com
              HostName github.com
              User git

          Host *
              ServerAliveInterval 60
              ServerAliveCountMax 10
              TCPKeepAlive yes
      tags: ansible-ctl

    - name: Clone or update ansible repo
      shell: |
        if [ -d /home/john/ansible/.git ]; then
          git -C /home/john/ansible pull
        else
          git clone https://github.com/john-critchley/ansible.git /home/john/ansible
        fi
      become: no
      changed_when: false
      tags: ansible-ctl

    - name: Deploy ansible secrets.yml to new controller
      copy:
        src: "{{ lookup('env', 'HOME') }}/ansible/secrets.yml"
        dest: /home/john/ansible/secrets.yml
        owner: john
        mode: '0600'
      become: no
      tags: ansible-ctl

    - name: Sync weekday skeleton to new controller
      become: no
      synchronize:
        src: "{{ lookup('env', 'HOME') }}/ansible/weekday/"
        dest: /home/john/ansible/weekday/
        recursive: yes
      tags: ansible-ctl

    - name: Read AWS credentials from controller secrets
      set_fact:
        aws_access_key_id: "{{ lookup('file', lookup('env', 'HOME') + '/ansible/secrets.yml') | from_yaml | json_query('aws_access_key_id') }}"
        aws_secret_access_key: "{{ lookup('file', lookup('env', 'HOME') + '/ansible/secrets.yml') | from_yaml | json_query('aws_secret_access_key') }}"
      delegate_to: localhost
      become: no
      no_log: true
      tags: ansible-ctl

    - name: Create ~/.aws directory on new controller
      file:
        path: /home/john/.aws
        state: directory
        owner: john
        mode: '0700'
      become: no
      tags: ansible-ctl

    - name: Deploy ~/.aws/credentials to new controller
      copy:
        dest: /home/john/.aws/credentials
        owner: john
        mode: '0600'
        content: |
          [default]
          aws_access_key_id = {{ aws_access_key_id }}
          aws_secret_access_key = {{ aws_secret_access_key }}

          [singapore]
          aws_access_key_id = {{ aws_access_key_id }}
          aws_secret_access_key = {{ aws_secret_access_key }}

          [frankfurt]
          aws_access_key_id = {{ aws_access_key_id }}
          aws_secret_access_key = {{ aws_secret_access_key }}

          [stockholm]
          aws_access_key_id = {{ aws_access_key_id }}
          aws_secret_access_key = {{ aws_secret_access_key }}
      become: no
      no_log: true
      tags: ansible-ctl

    # ── ask (multi-file document analysis via OpenAI) ────────────────────────

    - name: Create ~/py directory
      file:
        path: /home/john/py
        state: directory
        owner: john
        mode: '0755'
      become: no
      tags: ask

    - name: Create ~/git directory
      file:
        path: /home/john/git
        state: directory
        owner: john
        mode: '0755'
      become: no
      tags: ask

    - name: Clone or update ask repository
      shell: |
        if [ -d /home/john/git/ask/.git ]; then
          git -C /home/john/git/ask pull
        else
          rm -rf /home/john/git/ask
          git clone https://github.com/john-critchley/ask.git /home/john/git/ask
        fi
      become: no
      changed_when: false
      tags: ask

    - name: Install ask Python dependencies
      shell: pip3 install --user --break-system-packages openai python-docx PyYAML pdfplumber beautifulsoup4 numpy
      become: no
      changed_when: false
      environment:
        HOME: /home/john
      tags: ask

    - name: Enable api_keys bashrcs (makes OPENAI_API_KEY available in shell)
      file:
        path: /home/john/.bashrcs/api_keys
        mode: '0700'
        owner: john
      tags: ask

    - name: Ensure ask_gpt alias is present
      lineinfile:
        path: /home/john/.bashrcs/aliases
        regexp: "^alias ask_gpt="
        line: "alias ask_gpt='/home/john/git/ask/ask.py'"
        create: yes
        owner: john
        mode: '0700'
      become: no
      tags: ask

    - name: Remove sudo package
      apt:
        name: sudo
        state: absent
        purge: yes
      environment:
        SUDO_FORCE_REMOVE: "yes"
      when: remove_sudo_bool

    # ── rcs (rc.local / startup framework) ───────────────────────────────────

    - name: Read ZoneEdit secrets from controller
      set_fact:
        zoneedit_user: "{{ lookup('file', lookup('env', 'HOME') + '/ansible/secrets.yml') | from_yaml | json_query('zoneedit_user') }}"
        zoneedit_token: "{{ lookup('file', lookup('env', 'HOME') + '/ansible/secrets.yml') | from_yaml | json_query('zoneedit_token') }}"
        openai_api_key: "{{ lookup('file', lookup('env', 'HOME') + '/ansible/secrets.yml') | from_yaml | json_query('openai_api_key') }}"
      delegate_to: localhost
      become: no
      no_log: true
      tags: rcs

    - name: Deploy /etc/secrets.yml
      copy:
        dest: /etc/secrets.yml
        mode: '0640'
        owner: root
        group: root
        content: |
          zoneedit_user: "{{ zoneedit_user }}"
          zoneedit_token: "{{ zoneedit_token }}"
          openai_api_key: "{{ openai_api_key }}"
      no_log: true
      tags: rcs

    - name: Create /etc/rcs directory
      file:
        path: /etc/rcs
        state: directory
        mode: '0755'
        owner: root
        group: root
      tags: rcs

    - name: Deploy /etc/rcs/setdns
      template:
        src: files/setdns.j2
        dest: /etc/rcs/setdns
        mode: '0755'
        owner: root
        group: root
      tags: rcs

    - name: Deploy /etc/rc.local
      copy:
        src: files/rc.local
        dest: /etc/rc.local
        mode: '0755'
        owner: root
        group: root
      tags: rcs

    - name: Deploy rc-local systemd unit
      copy:
        dest: /etc/systemd/system/rc-local.service
        mode: '0644'
        owner: root
        group: root
        content: |
          [Unit]
          Description=rc.local compatibility
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/etc/rc.local start
          RemainAfterExit=yes
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
      tags: rcs

    - name: Enable rc-local service
      systemd:
        name: rc-local
        enabled: yes
        daemon_reload: yes
      tags: rcs

    - name: Run rc.local start now
      command: /etc/rc.local start
      tags: rcs

  handlers:
    - name: Restart sshd
      service:
        name: sshd
        state: restarted
